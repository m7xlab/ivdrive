# .github/workflows/sync-development.yml
#
# Keeps `development` in lockstep with `main` after every push to main.
# Ensures release/v* branches cut from `development` are always merge-clean
# and prevents the divergence that bit v1.1.2 (development was at ffa235e9,
# main at 9132835 — release/v1.1.2 had to be reset+cherry-picked).
#
# ── Required setup (one-time, in repo settings) ──────────────────────────
#
# 1. Settings → Actions → General → Workflow permissions:
#      "Read and write permissions" (the `permissions: contents: write` on this
#      workflow is scoped per-workflow; the repo-level setting must permit it).
#
# 2. Settings → Branches → `development` → Branch protection rules:
#      - If "Require a pull request before merging" is on, the workflow's
#        force-push needs to bypass it. Enable ONE of:
#        a) Settings → Actions → General → "Allow GitHub Actions to create
#           and approve pull requests" (easiest), OR
#        b) "Allow specified actors to bypass" with the bot account.
#      - If "Require signed commits" is on, the bot's force-push won't carry
#        a signature and the push will be rejected. Either:
#        a) Disable signed-commit requirement for `development`, OR
#        b) Add a GPG-signing step here (out of scope for v1).
#      - DO NOT enable "Require linear history" — this workflow performs a
#        linear fast-forward, so it satisfies that rule naturally if you
#        want it on.
#      - DO NOT enable "Do not allow force pushes" — that would block this
#        workflow entirely. (Or, since we only force-forward when main moved
#        forward, this is harmless to leave disabled; we're not overwriting
#        development's history arbitrarily.)
#
# ── Manual trigger ───────────────────────────────────────────────────────
#
# Actions tab → "Sync development from main" → "Run workflow" — useful after
# a back-merge, to resync from a hotfix branch, or to recover from a
# broken state.
#
# Generated by iVDrive Team ®

name: Sync development from main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref to sync development from"
        required: false
        default: "main"

concurrency:
  group: sync-development
  # Don't cancel an in-flight sync — if a push to main fires while the
  # previous sync is mid-push, let it complete. Cancelling could leave
  # development in an intermediate state.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Fast-forward development ← ${{ github.event.inputs.ref || 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          fetch-depth: 1

      - name: Capture source SHA
        id: src
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Source HEAD: $sha"

      - name: Capture current development SHA
        id: dev
        run: |
          sha=$(git ls-remote origin development | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Current development: $sha"

      - name: Skip when already in sync
        if: steps.src.outputs.sha == steps.dev.outputs.sha
        run: |
          echo "✅ development already at ${{ steps.src.outputs.sha }} (matches ${{ github.event.inputs.ref || 'main' }}). Nothing to do."
          exit 0

      - name: Fetch development for force-with-lease comparison
        if: steps.src.outputs.sha != steps.dev.outputs.sha
        run: |
          git fetch origin development

      - name: Fast-forward development
        if: steps.src.outputs.sha != steps.dev.outputs.sha
        run: |
          set -euo pipefail
          echo "📌 Before:"
          echo "  ${{ github.event.inputs.ref || 'main' }}:    ${{ steps.src.outputs.sha }}"
          echo "  development: ${{ steps.dev.outputs.sha }}"
          # --force-with-lease prevents clobbering a concurrent push to
          # development (e.g. a developer committing directly to dev).
          git push origin "HEAD:development" --force-with-lease=refs/heads/development:refs/remotes/origin/development
          echo "✅ development now at ${{ steps.src.outputs.sha }} (synced from ${{ github.event.inputs.ref || 'main' }})"