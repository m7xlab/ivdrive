# Lint gate added in v1.4.0. Backend ruff is blocking (the rule set in backend/ruff.toml is
# correctness only). Frontend ESLint is reported, not blocking, until the pre-existing
# no-explicit-any / set-state-in-effect debt is paid down.
name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff — backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check app tests
        working-directory: backend

  eslint:
    name: eslint + tsc — frontend (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
