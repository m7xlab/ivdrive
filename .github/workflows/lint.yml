# Lint gate. Backend ruff (the rule set in backend/ruff.toml is correctness only) and frontend
# type-check + ESLint errors are blocking.
name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff — backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check app tests
        working-directory: backend

  eslint:
    name: eslint + tsc — frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      # Errors fail the build. The remaining react-hooks/set-state-in-effect warnings (see
      # frontend/eslint.config.mjs) are reported but do not.
      - run: npm run lint
        working-directory: frontend
