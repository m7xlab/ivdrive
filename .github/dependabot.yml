# Dependabot VERSION updates are paused (open-pull-requests-limit: 0 everywhere): no routine bump PRs.
# Security updates are a separate GitHub feature with their own limit and are NOT affected: when an
# advisory exists for something we use, GitHub still opens a PR for it. The weekly dependency-audit
# workflow reports vulnerable locked versions regardless.
#
# To resume routine bumps, raise the limits (2 is a good start); the rest of the settings below are
# already the quiet ones: monthly, minor and patch only, grouped, majors ignored.
version: 2
updates:
  # backend/requirements.lock is generated by pip-compile (see backend/Dockerfile) and Dependabot
  # does not regenerate it; it only watches requirements.txt. The weekly dependency-audit workflow
  # runs pip-audit on the lock itself, which is the control that notices a vulnerable locked
  # version; the fix is to re-run pip-compile (a versioning-strategy bump here would move
  # requirements.txt without the lock, which the image build ignores).
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, python]
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, frontend]
    groups:
      frontend: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # React 19 is a planned upgrade (PLAN-frontend-version-upgrade-v1.md), not a bot bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, docker]
    ignore:
      # The runtime is Python 3.12; moving to 3.13+ is a tested upgrade, not a drive-by.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, docker]
    ignore:
      # Node 24 is the LTS the app targets (engines >=24 <27); majors are done by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, ci]
    groups:
      actions: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
