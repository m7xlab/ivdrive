# Dependabot: monthly, minor and patch only, grouped. Major (and, for the Python image, minor)
# version jumps are deliberate decisions and are done by hand (see the ignore rules). Security
# updates are not delayed by the schedule: GitHub raises those as soon as an advisory exists.
version: 2
updates:
  # backend/requirements.lock is generated by pip-compile (see backend/Dockerfile) and Dependabot
  # does not regenerate it; it only watches requirements.txt. The weekly dependency-audit workflow
  # runs pip-audit on the lock itself, which is the control that notices a vulnerable locked
  # version; the fix is to re-run pip-compile (a versioning-strategy bump here would move
  # requirements.txt without the lock, which the image build ignores).
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, python]
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, frontend]
    groups:
      frontend: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # React 19 is a planned upgrade (PLAN-frontend-version-upgrade-v1.md), not a bot bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, docker]
    ignore:
      # The runtime is Python 3.12; moving to 3.13+ is a tested upgrade, not a drive-by.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, docker]
    ignore:
      # Node 24 is the LTS the app targets (engines >=24 <27); majors are done by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, ci]
    groups:
      actions: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
